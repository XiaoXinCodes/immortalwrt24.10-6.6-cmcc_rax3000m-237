name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  MIN_BUILD_FREE_GIB: 50

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      issues: write
      contents: write
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Reclaim unused runner software
      uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523
      with:
        android: 'true'
        dotnet: 'true'
        haskell: 'true'
        large-packages: 'true'
        docker-images: 'true'
        preinstalled-runtimes: 'false'
        swap-storage: 'false'

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Install dependencies before reserving root disk space for the build volume.
        # Initial cleanup has already removed unrelated runner software.
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
        g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
        libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
        libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
        ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
        python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
        upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Plan disk reserves
      id: disk
      run: |
        root_reserve_mb=4096
        temp_reserve_mb=1024
        # Some runner images put /mnt on the root filesystem. Allow another
        # 1 GiB for its loop image so the two allocations still leave 4 GiB.
        if [ "$(stat -c '%d' /)" = "$(stat -c '%d' /mnt)" ]; then
          root_reserve_mb=5120
          temp_reserve_mb=4096
        fi
        echo "root_reserve_mb=$root_reserve_mb" >> "$GITHUB_OUTPUT"
        echo "temp_reserve_mb=$temp_reserve_mb" >> "$GITHUB_OUTPUT"
        df -hT / /mnt

    - name: Allocate the actual build volume
      uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
      with:
        build-mount-path: /workdir
        root-reserve-mb: ${{ steps.disk.outputs.root_reserve_mb }}
        temp-reserve-mb: ${{ steps.disk.outputs.temp_reserve_mb }}
        swap-size-mb: 1024
        overprovision-lvm: 'false'
        remove-dotnet: 'false'
        remove-android: 'false'
        remove-haskell: 'false'
        remove-codeql: 'false'
        remove-docker-images: 'false'

    - name: Verify the disk layout before downloading source
      run: |
        mountpoint -q /workdir
        root_device=$(stat -c '%d' /)
        build_device=$(stat -c '%d' /workdir)
        if [ "$root_device" = "$build_device" ]; then
          echo "::error::/workdir must be on the allocated build filesystem"
          exit 1
        fi
        df -hT / /workdir
        df -i / /workdir
        available_bytes=$(df -B1 --output=avail /workdir | tail -n1 | tr -d ' ')
        minimum_bytes=$((MIN_BUILD_FREE_GIB * 1024 * 1024 * 1024))
        if [ "$available_bytes" -lt "$minimum_bytes" ]; then
          echo "::error::Build disk has less than ${MIN_BUILD_FREE_GIB} GiB free; use a larger runner or revise the measured build budget"
          exit 1
        fi
        mkdir -p /workdir/tmp /workdir/.cache
        echo 'TMPDIR=/workdir/tmp' >> "$GITHUB_ENV"
        echo 'XDG_CACHE_HOME=/workdir/.cache' >> "$GITHUB_ENV"
        df -hT / /workdir > /workdir/disk-layout.log

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt --single-branch --filter=blob:none
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        [ -e files ] && cp -a files openwrt/files
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Validate configuration and download packages
      id: package
      run: |
        cd openwrt
        sed -i '/^CONFIG_AUTOREMOVE=/d; /^# CONFIG_AUTOREMOVE is not set$/d' .config
        echo 'CONFIG_AUTOREMOVE=y' >> .config
        # Fail immediately if an upstream update introduces a Kconfig cycle.
        make defconfig RECURSIVE_DEP_IS_ERROR=1
        grep -qx 'CONFIG_AUTOREMOVE=y' .config
        grep -qx 'CONFIG_DOWNLOAD_CHECK_CERTIFICATE=y' .config
        make -j4 prereq
        df -hT / /workdir
        make download -j4

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        (
          while true; do
            date -u
            df -hT / /workdir
            df -i / /workdir
            sleep 180
          done
        ) > /workdir/disk-monitor.log 2>&1 &
        monitor_pid=$!
        trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
        set -o pipefail
        # Avoid repeated full builds and massive verbose runner logs on ENOSPC.
        if make -j4 BUILD_LOG=1 2>&1 | tee /workdir/compile.log; then
          echo "status=success" >> "$GITHUB_OUTPUT"
        else
          python3 "$GITHUB_WORKSPACE/scripts/report-build-errors.py" --build-dir "$PWD" --console-log /workdir/compile.log
          exit 1
        fi
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Check space usage
      if: always()
      run: |
        df -hT /
        df -i /
        if [ -d /workdir ]; then
          df -hT /workdir
          df -i /workdir
        fi
        if [ -d /workdir/openwrt ]; then
          du -xh --max-depth=1 /workdir/openwrt > /workdir/disk-usage.log || true
          cat /workdir/disk-usage.log
        fi

    - name: Preserve failure diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-diagnostics
        if-no-files-found: ignore
        retention-days: 7
        include-hidden-files: true
        path: |
          /workdir/compile.log
          /workdir/disk-layout.log
          /workdir/disk-monitor.log
          /workdir/disk-usage.log
          /workdir/openwrt/.config
          /workdir/openwrt/proxy-package-versions.json
          /workdir/openwrt/logs

    - name: Clean up build artifacts
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt
        echo "Cleaning up large build directories..."
        rm -rf build_dir staging_dir tmp dl
        df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    # 整理编译好的固件
    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        rm -rf *.buildinfo
        rm -rf *.manifest
        rm -rf *.json
        rm -rf *bl2.bin
        cp "$GITHUB_WORKSPACE/openwrt/proxy-package-versions.json" .
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        df -hT

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo release_tag=$(date +\"%Y.%m.%d-%H%M-immortalwrt24.10-6.6-cmcc_rax3000m-237\") >> $GITHUB_OUTPUT
        touch release.txt
        echo "cmcc_rax3000m-237大功率固件" >> release.txt
        echo "后台：192.168.6.1" >> release.txt
        echo "账号：root" >> release.txt
        echo "密码：无" >> release.txt
        echo "默认主题：Argon" >> release.txt
        echo "集成插件：homeproxy easytier zerotier usb-printer usb-net ttyd iperf3 upnp" >> release.txt
        echo "编译源码：https://github.com/padavanonly/immortalwrt-mt798x-6.6" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
